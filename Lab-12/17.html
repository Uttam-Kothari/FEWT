<!-- 17. write a jQuery program to validate the darshan enrollment no when user leave the textbox (blur). (B) -->
 
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>

  <body>
    <input type="text" id="enrollmentNo" placeholder="Enter Enrollment No" />
    <p id="validationMessage"></p>

    <script>
      $(document).ready(function () {
        $("#enrollmentNo").blur(function () {
          var enrollmentNo = $(this).val();
          var isValid = /^[0-9]{11}$/.test(enrollmentNo);
          if (isValid) {
            $("#validationMessage")
              .text("Valid Enrollment No")
              .css("color", "green");
          } else {
            $("#validationMessage")
              .text("Invalid Enrollment No")
              .css("color", "red");
          }
        });
      });
    </script>
  </body>
</html>

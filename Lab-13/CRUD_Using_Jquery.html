<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management System</title>

    <script
      src="https://code.jquery.com/jquery-4.0.0.min.js"
      integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
      crossorigin="anonymous"
    ></script>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        min-height: 100vh;
        padding: 40px 20px;
      }

      .container {
        max-width: 1100px;
        margin: auto;
      }

      .title {
        text-align: center;
        color: white;
        margin-bottom: 25px;
      }

      .title h1 {
        font-size: 35px;
        margin-bottom: 8px;
      }

      .title p {
        font-size: 16px;
        opacity: 0.9;
      }

      /* Form Card */
      .form-card {
        background: white;
        padding: 30px;
        border-radius: 18px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        margin-bottom: 30px;
      }

      .form-card h2 {
        color: #333;
        margin-bottom: 25px;
        text-align: center;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }

      .input-group {
        display: flex;
        flex-direction: column;
      }

      .input-group label {
        font-weight: bold;
        margin-bottom: 7px;
        color: #444;
        text-transform: capitalize;
      }

      .input-group input {
        padding: 12px 14px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
        transition: 0.3s;
      }

      .input-group input:focus {
        border-color: #667eea;
        box-shadow: 0 0 8px rgba(102, 126, 234, 0.3);
      }

      /* Buttons */
      .buttons {
        margin-top: 25px;
        display: flex;
        justify-content: center;
        gap: 15px;
      }

      .btn {
        border: none;
        padding: 12px 30px;
        border-radius: 8px;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      .btn-add {
        background: #28a745;
      }

      .btn-add:hover {
        background: #218838;
        transform: translateY(-2px);
      }

      .btn-update {
        background: #007bff;
      }

      .btn-update:hover {
        background: #0069d9;
        transform: translateY(-2px);
      }

      /* Table Card */
      .table-card {
        background: white;
        padding: 25px;
        border-radius: 18px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        overflow-x: auto;
      }

      .table-card h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 750px;
      }

      thead {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
      }

      th,
      td {
        padding: 14px 12px;
        text-align: center;
        border-bottom: 1px solid #ddd;
      }

      th {
        font-size: 15px;
      }

      tbody tr {
        transition: 0.2s;
      }

      tbody tr:hover {
        background: #f3f4ff;
      }

      /* Table Buttons */
      .edit-btn,
      .delete-btn {
        border: none;
        padding: 7px 13px;
        border-radius: 6px;
        color: white;
        cursor: pointer;
        font-weight: bold;
        margin: 2px;
      }

      .edit-btn {
        background: #ffc107;
        color: #222;
      }

      .edit-btn:hover {
        background: #e0a800;
      }

      .delete-btn {
        background: #dc3545;
      }

      .delete-btn:hover {
        background: #c82333;
      }

      /* Responsive */
      @media (max-width: 700px) {
        body {
          padding: 20px 10px;
        }

        .form-grid {
          grid-template-columns: 1fr;
        }

        .title h1 {
          font-size: 27px;
        }

        .form-card,
        .table-card {
          padding: 20px;
        }

        .buttons {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="title">
        <h1>🎓 Student Management System</h1>
        <p>Add, edit and manage student information</p>
      </div>

      <!-- Form -->
      <div class="form-card">
        <h2>Student Information</h2>

        <div class="form-grid">
          <div class="input-group">
            <label>First Name</label>
            <input type="text" id="fname" placeholder="Enter first name" />
          </div>

          <div class="input-group">
            <label>Last Name</label>
            <input type="text" id="lname" placeholder="Enter last name" />
          </div>

          <div class="input-group">
            <label>Age</label>
            <input type="number" id="age" placeholder="Enter age" />
          </div>

          <div class="input-group">
            <label>Semester</label>
            <input type="number" id="sem" placeholder="Enter semester" />
          </div>

          <div class="input-group">
            <label>Roll No</label>
            <input type="number" id="roll" placeholder="Enter roll number" />
          </div>
        </div>

        <div class="buttons">
          <button class="btn btn-add" id="add" onclick="add()">
            ➕ Add Student
          </button>

          <button class="btn btn-update" id="update" onclick="update()">
            ✏️ Update Student
          </button>
        </div>
      </div>

      <!-- Table -->
      <div class="table-card">
        <h2>📋 Student List</h2>

        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Age</th>
              <th>Semester</th>
              <th>Roll No.</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

    <script>
      let arr = [];
      let x = -1;

      // Display data
      function display() {
        let temp = "";

        for (let i = 0; i < arr.length; i++) {
          temp += `
                <tr>

                    <td>${i + 1}</td>

                    <td>${arr[i].fname}</td>

                    <td>${arr[i].lname}</td>

                    <td>${arr[i].age}</td>

                    <td>${arr[i].semester}</td>

                    <td>${arr[i].roll}</td>

                    <td>

                        <button class="edit-btn"
                            onclick="edit(${i})">
                            ✏️ Edit
                        </button>

                        <button class="delete-btn"
                            onclick="del(${i})">
                            🗑️ Delete
                        </button>

                    </td>

                </tr>
            `;
        }

        $("#tbody").html(temp);
      }

      // Clear form
      function clearform() {
        $("#fname").val("");
        $("#lname").val("");
        $("#age").val("");
        $("#sem").val("");
        $("#roll").val("");
      }

      // Add student
      function add() {
        let student = {
          fname: $("#fname").val(),

          lname: $("#lname").val(),

          age: $("#age").val(),

          semester: $("#sem").val(),

          roll: $("#roll").val(),
        };

        if (
          student.fname === "" ||
          student.lname === "" ||
          student.age === "" ||
          student.semester === "" ||
          student.roll === ""
        ) {
          alert("Please fill all fields!");
          return;
        }

        arr.push(student);

        clearform();

        display();
      }

      // Delete student
      function del(i) {
        if (confirm("Are you sure you want to delete this student?")) {
          arr.splice(i, 1);

          display();
        }
      }

      // Edit student
      function edit(i) {
        $("#fname").val(arr[i].fname);

        $("#lname").val(arr[i].lname);

        $("#age").val(arr[i].age);

        $("#sem").val(arr[i].semester);

        $("#roll").val(arr[i].roll);

        x = i;
      }

      // Update student
      function update() {
        if (x == -1) {
          alert("Please select the Edit button first!");

          return;
        }

        let student = {
          fname: $("#fname").val(),

          lname: $("#lname").val(),

          age: $("#age").val(),

          semester: $("#sem").val(),

          roll: $("#roll").val(),
        };

        arr[x] = student;

        x = -1;

        clearform();

        display();
      }
    </script>
  </body>
</html>

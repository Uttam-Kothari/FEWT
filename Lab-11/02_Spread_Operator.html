<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const arr = [1, 2, 3, 4, 5, 6];
        const arr2 = [7, 8, 9, 10];

        const copyarr = [...arr];

        console.log(copyarr);

        const merage = [...arr, ...arr2];

        console.log(merage);
        
        for (temp of arr) {
            console.log(temp);
        }


        //object


        let o1 = {
            name: 'Uttam',
            age: 18
        }

        let op1 = { ...o1 };

        console.log(op1);
        
        // for in loop  (return index)

        for (temp in o1) {
            console.log(o1[temp]);
        }

        //for of loop 
        
        for (temp of o1.name) {
            console.log(temp);
        }

    </script>
</body>

</html>
